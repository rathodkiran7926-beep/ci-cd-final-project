apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oc-pipelines-pvc
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cicd-pipeline
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cicd-pipeline
rules:
  - apiGroups: ['build.openshift.io']
    resources: [buildconfigs, buildconfigs/instantiatebinary, builds, builds/log]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: ['image.openshift.io']
    resources: [imagestreams, imagestreamtags]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: ['apps']
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: ['']
    resources: [services, pods, pods/log]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: ['route.openshift.io']
    resources: [routes]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cicd-pipeline
subjects:
  - kind: ServiceAccount
    name: cicd-pipeline
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cicd-pipeline
