apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: remove
      image: alpine:3.21
      env:
        - name: WORKSPACE_SOURCE_PATH
          value: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        # Restrict deletion to this Task's mounted source workspace.
        test "$WORKSPACE_SOURCE_PATH" = /workspace/source
        rm -rf -- "$WORKSPACE_SOURCE_PATH"/* \
          "$WORKSPACE_SOURCE_PATH"/.[!.]* \
          "$WORKSPACE_SOURCE_PATH"/..?*
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: jest
spec:
  workspaces:
    - name: source
  steps:
    - name: jest
      image: node:22-alpine
      workingDir: $(workspaces.source.path)/repo
      env:
        - name: HOME
          value: /tmp
        - name: npm_config_cache
          value: /tmp/npm-cache
      script: |
        #!/bin/sh
        set -eu
        npm test
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
spec:
  params:
    - name: repo-url
      type: string
    - name: revision
      type: string
      default: main
  workspaces:
    - name: source
  steps:
    - name: git-clone
      image: alpine/git:2.47.2
      workingDir: $(workspaces.source.path)
      env:
        - name: REPO_URL
          value: $(params.repo-url)
        - name: REVISION
          value: $(params.revision)
      script: |
        #!/bin/sh
        set -eu
        git clone --depth 1 --branch "$REVISION" -- "$REPO_URL" repo
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: eslint
spec:
  workspaces:
    - name: source
  steps:
    - name: eslint
      image: node:22-alpine
      workingDir: $(workspaces.source.path)/repo
      env:
        - name: HOME
          value: /tmp
        - name: npm_config_cache
          value: /tmp/npm-cache
      script: |
        #!/bin/sh
        set -eu
        npm ci
        npm run lint
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: openshift-client
spec:
  params:
    - name: IMAGE
      type: string
  workspaces:
    - name: source
  steps:
    - name: deploy
      image: quay.io/openshift/origin-cli:4.16
      workingDir: $(workspaces.source.path)/repo
      env:
        - name: IMAGE
          value: $(params.IMAGE)
      script: |
        #!/bin/sh
        set -eu
        # Apply the Deployment with the image built by this PipelineRun.
        oc set image --local -f openshift/deployment.yml "app=$IMAGE" -o yaml > /tmp/deployment.yml
        oc apply -f /tmp/deployment.yml
        oc apply -f openshift/resources.yml
        oc rollout status deployment/cicd-app --timeout=180s
        oc get deployment cicd-app
        oc get route cicd-app
        oc logs deployment/cicd-app --tail=100
