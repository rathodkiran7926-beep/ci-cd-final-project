apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: oc-final-
spec:
  pipelineRef:
    name: oc-final
  taskRunTemplate:
    serviceAccountName: pipeline
  params:
    - name: repo-url
      value: https://github.com/rathodkiran7926-beep/ci-cd-final-project.git
    - name: revision
      value: main
  workspaces:
    - name: shared-workspace
      persistentVolumeClaim:
        claimName: oc-lab-pvc
  timeouts:
    pipeline: 30m0s
