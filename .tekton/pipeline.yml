apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: oc-final
spec:
  params:
    - name: repo-url
      type: string
    - name: revision
      type: string
      default: main
    - name: registry
      type: string
      default: image-registry.openshift-image-registry.svc:5000
  workspaces:
    - name: shared-workspace
  tasks:
    - name: cleanup
      taskRef:
        name: cleanup
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: git-clone
      runAfter: [cleanup]
      taskRef:
        name: git-clone
      params:
        - name: repo-url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: eslint
      runAfter: [git-clone]
      taskRef:
        name: eslint
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: jest
      runAfter: [eslint]
      taskRef:
        name: jest
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: buildah
      runAfter: [jest]
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: namespace
            value: openshift-pipelines
          - name: name
            value: buildah
      params:
        - name: IMAGE
          value: $(params.registry)/$(context.pipelineRun.namespace)/cicd-app:$(context.pipelineRun.name)
        - name: CONTEXT
          value: .
        - name: DOCKERFILE
          value: ./Dockerfile
        - name: TLSVERIFY
          value: 'false'
      workspaces:
        - name: source
          workspace: shared-workspace
          subPath: repo
    - name: deploy
      runAfter: [buildah]
      taskRef:
        name: openshift-client
      params:
        - name: IMAGE
          value: $(params.registry)/$(context.pipelineRun.namespace)/cicd-app:$(context.pipelineRun.name)
      workspaces:
        - name: source
          workspace: shared-workspace
